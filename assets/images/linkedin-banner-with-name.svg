  <text x="792" y="150" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#5bb8f5" text-anchor="middle" letter-spacing="5" opacity="0.95">✦ BIONOVA HEALTH RESEARCH LLC ✦</text>
  <text x="792" y="210" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Advancing the Future of</text>
  <text x="792" y="256" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="600" fill="#5bb8f5" text-anchor="middle" letter-spacing="-1">Biomedical Research</text>
  <text x="792" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.55)" text-anchor="middle">Science-driven. Expertise-led.</text>
