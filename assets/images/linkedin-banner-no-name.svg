<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="fade-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1f44" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0a1f44" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fade-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="60%" stop-color="#0a1f44" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1f44" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1a3a6e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1f44" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="#0a1f44"/>

  <!-- Subtle center glow -->
  <rect width="1584" height="396" fill="url(#center-glow)"/>

  <!-- Left illustration: gene network -->
  <image href="hero-left.svg" x="-40" y="-30" width="620" height="456" opacity="0.7"/>
  <rect x="0" y="0" width="580" height="396" fill="url(#fade-left)"/>

  <!-- Right illustration: DNA helix -->
  <image href="hero.svg" x="1004" y="-30" width="620" height="456" opacity="0.7"/>
  <rect x="1004" y="0" width="580" height="396" fill="url(#fade-right)"/>
</svg>
