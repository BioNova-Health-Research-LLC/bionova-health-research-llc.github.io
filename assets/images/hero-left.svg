<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" fill="none">
  <defs>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .edge       { stroke-dasharray:6 12; animation:flow 2.4s linear infinite; }
      .edge-slow  { stroke-dasharray:5 14; animation:flow 3.6s linear infinite; }
      .edge-fast  { stroke-dasharray:4 9;  animation:flow 1.8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-72; } }

      .halo { animation:halo-p 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes halo-p { 0%,100%{opacity:0.12;transform:scale(1);} 50%{opacity:0.45;transform:scale(1.6);} }

      .node-lbl { font-family:'Inter',monospace; font-weight:600; letter-spacing:0.04em; }
    </style>
  </defs>

  <!-- ═══════════════════════════════════
       BACKGROUND GRID — faint
       ═══════════════════════════════════ -->
  <g opacity="0.07" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0"   y1="80"  x2="480" y2="80"/>
    <line x1="0"   y1="160" x2="480" y2="160"/>
    <line x1="0"   y1="240" x2="480" y2="240"/>
    <line x1="0"   y1="320" x2="480" y2="320"/>
    <line x1="0"   y1="400" x2="480" y2="400"/>
    <line x1="80"  y1="0"   x2="80"  y2="520"/>
    <line x1="160" y1="0"   x2="160" y2="520"/>
    <line x1="240" y1="0"   x2="240" y2="520"/>
    <line x1="320" y1="0"   x2="320" y2="520"/>
    <line x1="400" y1="0"   x2="400" y2="520"/>
  </g>

  <!-- ═══════════════════════════════════
       EDGES (gene interactions)
       ═══════════════════════════════════ -->

  <!-- TP53 hub edges -->
  <line class="edge"      x1="200" y1="255" x2="140" y2="168" stroke="#38bdf8" stroke-width="1.4" opacity="0.7"/>   <!-- TP53–MDM2 -->
  <line class="edge-slow" x1="200" y1="255" x2="285" y2="155" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6"/>   <!-- TP53–BRCA1 -->
  <line class="edge"      x1="200" y1="255" x2="316" y2="240" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" style="animation-delay:-0.8s"/>  <!-- TP53–ATM -->
  <line class="edge-slow" x1="200" y1="255" x2="275" y2="345" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6" style="animation-delay:-1.4s"/>  <!-- TP53–CDKN1A -->
  <line class="edge-fast" x1="200" y1="255" x2="112" y2="290" stroke="#bae6fd" stroke-width="1.2" opacity="0.65" style="animation-delay:-0.4s"/> <!-- TP53–PTEN -->
  <line class="edge"      x1="200" y1="255" x2="130" y2="345" stroke="#38bdf8" stroke-width="1"   opacity="0.5" style="animation-delay:-1.0s"/> <!-- TP53–STAT3 -->

  <!-- Secondary edges -->
  <line class="edge-slow" x1="285" y1="155" x2="316" y2="240" stroke="#7dd3fc" stroke-width="1"   opacity="0.45" style="animation-delay:-0.6s"/>  <!-- BRCA1–ATM -->
  <line class="edge"      x1="316" y1="240" x2="360" y2="310" stroke="#38bdf8" stroke-width="1"   opacity="0.45" style="animation-delay:-1.2s"/>  <!-- ATM–AKT1 -->
  <line class="edge-slow" x1="275" y1="345" x2="360" y2="310" stroke="#7dd3fc" stroke-width="1"   opacity="0.4"  style="animation-delay:-0.3s"/>  <!-- CDKN1A–AKT1 -->
  <line class="edge-fast" x1="112" y1="290" x2="130" y2="345" stroke="#bae6fd" stroke-width="1"   opacity="0.4"  style="animation-delay:-1.6s"/>  <!-- PTEN–STAT3 -->
  <line class="edge"      x1="140" y1="168" x2="76"  y2="180" stroke="#38bdf8" stroke-width="0.9" opacity="0.4"  style="animation-delay:-0.9s"/>  <!-- MDM2–EGFR -->
  <line class="edge-slow" x1="76"  y1="180" x2="112" y2="290" stroke="#7dd3fc" stroke-width="0.9" opacity="0.35" style="animation-delay:-0.2s"/>  <!-- EGFR–PTEN -->
  <line class="edge"      x1="360" y1="310" x2="390" y2="210" stroke="#38bdf8" stroke-width="0.9" opacity="0.4"  style="animation-delay:-1.8s"/>  <!-- AKT1–MTOR -->
  <line class="edge-slow" x1="390" y1="210" x2="285" y2="155" stroke="#7dd3fc" stroke-width="0.9" opacity="0.35" style="animation-delay:-0.7s"/>  <!-- MTOR–BRCA1 -->
  <line class="edge-fast" x1="130" y1="345" x2="275" y2="345" stroke="#bae6fd" stroke-width="0.9" opacity="0.3"  style="animation-delay:-1.3s"/>  <!-- STAT3–CDKN1A -->

  <!-- Tertiary / peripheral edges -->
  <line class="edge"      x1="76"  y1="180" x2="56"  y2="100" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"  style="animation-delay:-0.5s"/>
  <line class="edge-slow" x1="390" y1="210" x2="420" y2="140" stroke="#7dd3fc" stroke-width="0.8" opacity="0.3"  style="animation-delay:-1.1s"/>
  <line class="edge-fast" x1="130" y1="345" x2="90"  y2="430" stroke="#bae6fd" stroke-width="0.8" opacity="0.25" style="animation-delay:-0.6s"/>
  <line class="edge"      x1="360" y1="310" x2="400" y2="400" stroke="#38bdf8" stroke-width="0.8" opacity="0.25" style="animation-delay:-1.0s"/>

  <!-- ═══════════════════════════════════
       NODES
       ═══════════════════════════════════ -->

  <!-- ── TP53 — central hub (largest, white glow) ── -->
  <circle class="halo" cx="200" cy="255" r="10" stroke="#e0f2fe" stroke-width="1.5" fill="none" style="animation-delay:0s"/>
  <circle cx="200" cy="255" r="14" fill="#1e3a8a" stroke="#e0f2fe" stroke-width="2" filter="url(#gl)"/>
  <text x="200" y="259" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#f0f9ff" font-size="9">TP53</text>

  <!-- ── MDM2 ── -->
  <circle class="halo" cx="140" cy="168" r="8" stroke="#38bdf8" stroke-width="1.2" fill="none" style="animation-delay:0.6s"/>
  <circle cx="140" cy="168" r="11" fill="#1d4ed8" stroke="#38bdf8" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="140" y="172" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8">MDM2</text>

  <!-- ── BRCA1 ── -->
  <circle class="halo" cx="285" cy="155" r="8" stroke="#7dd3fc" stroke-width="1.2" fill="none" style="animation-delay:1.2s"/>
  <circle cx="285" cy="155" r="11" fill="#1d4ed8" stroke="#7dd3fc" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="285" y="159" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8">BRCA1</text>

  <!-- ── ATM ── -->
  <circle class="halo" cx="316" cy="240" r="7" stroke="#38bdf8" stroke-width="1" fill="none" style="animation-delay:0.4s"/>
  <circle cx="316" cy="240" r="10" fill="#1e40af" stroke="#38bdf8" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="316" y="244" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8">ATM</text>

  <!-- ── CDKN1A ── -->
  <circle class="halo" cx="275" cy="345" r="7" stroke="#7dd3fc" stroke-width="1" fill="none" style="animation-delay:1.8s"/>
  <circle cx="275" cy="345" r="10" fill="#1e40af" stroke="#7dd3fc" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="275" y="349" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="7.5">CDKN1A</text>

  <!-- ── PTEN ── -->
  <circle class="halo" cx="112" cy="290" r="7" stroke="#38bdf8" stroke-width="1" fill="none" style="animation-delay:0.9s"/>
  <circle cx="112" cy="290" r="10" fill="#1e40af" stroke="#38bdf8" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="112" y="294" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8">PTEN</text>

  <!-- ── STAT3 ── -->
  <circle class="halo" cx="130" cy="345" r="6" stroke="#93c5fd" stroke-width="1" fill="none" style="animation-delay:1.5s"/>
  <circle cx="130" cy="345" r="9"  fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.2" filter="url(#gl-sm)"/>
  <text x="130" y="349" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="7.5">STAT3</text>

  <!-- ── EGFR ── -->
  <circle class="halo" cx="76" cy="180" r="7" stroke="#7dd3fc" stroke-width="1" fill="none" style="animation-delay:0.3s"/>
  <circle cx="76" cy="180" r="10" fill="#1d4ed8" stroke="#7dd3fc" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="76" y="184" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8">EGFR</text>

  <!-- ── AKT1 ── -->
  <circle class="halo" cx="360" cy="310" r="7" stroke="#38bdf8" stroke-width="1" fill="none" style="animation-delay:2.0s"/>
  <circle cx="360" cy="310" r="10" fill="#1e40af" stroke="#38bdf8" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="360" y="314" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8">AKT1</text>

  <!-- ── MTOR ── -->
  <circle class="halo" cx="390" cy="210" r="6" stroke="#7dd3fc" stroke-width="1" fill="none" style="animation-delay:1.1s"/>
  <circle cx="390" cy="210" r="9"  fill="#1e3a8a" stroke="#7dd3fc" stroke-width="1.2" filter="url(#gl-sm)"/>
  <text x="390" y="214" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8">MTOR</text>

  <!-- Peripheral leaf nodes (smaller, no label) -->
  <circle cx="56"  cy="100" r="5"  fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" opacity="0.7" filter="url(#gl-sm)"/>
  <circle cx="420" cy="140" r="5"  fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" opacity="0.7" filter="url(#gl-sm)"/>
  <circle cx="90"  cy="430" r="5"  fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" opacity="0.6" filter="url(#gl-sm)"/>
  <circle cx="400" cy="400" r="5"  fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" opacity="0.6" filter="url(#gl-sm)"/>


  <!-- ═══════════════════════════════════
       GENOME STRIP — bottom
       ═══════════════════════════════════ -->
  <line x1="20" y1="504" x2="440" y2="504" stroke="#38bdf8" stroke-width="0.5" opacity="0.2"/>
  <text x="24" y="515" fill="#7dd3fc" font-size="8" font-family="monospace" letter-spacing="3" opacity="0.4">G C A T G G A T C G T A C C G A T A T G C G A</text>
</svg>
