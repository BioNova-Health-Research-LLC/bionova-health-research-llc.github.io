<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -20 540 560" width="480" height="520" fill="none">
  <defs>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .edge      { stroke-dasharray:6 12; animation:flow 2.4s linear infinite; }
      .edge-slow { stroke-dasharray:5 14; animation:flow 3.6s linear infinite; }
      .edge-fast { stroke-dasharray:4 9;  animation:flow 1.8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-72; } }
      .halo { animation:halo-p 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes halo-p { 0%,100%{opacity:0.12;transform:scale(1);} 50%{opacity:0.45;transform:scale(1.6);} }
      .node-lbl { font-family:'Inter',monospace; font-weight:600; letter-spacing:0.04em; }
    </style>
  </defs>

  <!-- Background grid -->
  <g opacity="0.07" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0"   y1="80"  x2="480" y2="80"/>
    <line x1="0"   y1="160" x2="480" y2="160"/>
    <line x1="0"   y1="240" x2="480" y2="240"/>
    <line x1="0"   y1="320" x2="480" y2="320"/>
    <line x1="0"   y1="400" x2="480" y2="400"/>
    <line x1="80"  y1="0"   x2="80"  y2="520"/>
    <line x1="160" y1="0"   x2="160" y2="520"/>
    <line x1="240" y1="0"   x2="240" y2="520"/>
    <line x1="320" y1="0"   x2="320" y2="520"/>
    <line x1="400" y1="0"   x2="400" y2="520"/>
  </g>

  <!--
    Compact layout — all nodes x=75–345, y=95–445
    Cluster pulled together, right edge clear of hero text

      MX1     ( 80,  95)
      TLR4    (200, 105)   upstream sensor
      OAS1    (320,  95)
      IRF3    ( 80, 205)
      STAT1   (305, 200)
      NFKB1   (195, 295)  CENTRAL HUB
      IFNG    (340, 295)
      CXCL10  ( 80, 365)
      TNF     (155, 430)
      IL6     (260, 435)
      IL10    (345, 370)
  -->

  <!-- ── EDGES ── -->

  <!-- TLR4 → NFKB1 -->
  <line class="edge"      x1="200" y1="105" x2="195" y2="295" stroke="#38bdf8" stroke-width="1.5" opacity="0.75" style="animation-delay:0s"/>
  <!-- TLR4 → IRF3 -->
  <line class="edge-slow" x1="200" y1="105" x2="80"  y2="205" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6"  style="animation-delay:-0.6s"/>
  <!-- TLR4 → STAT1 (minor) -->
  <line class="edge-fast" x1="200" y1="105" x2="305" y2="200" stroke="#bae6fd" stroke-width="0.9" opacity="0.35" style="animation-delay:-1.2s"/>

  <!-- IRF3 → STAT1 -->
  <line class="edge-slow" x1="80"  y1="205" x2="305" y2="200" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6"  style="animation-delay:-0.8s"/>

  <!-- STAT1 → MX1 -->
  <line class="edge"      x1="305" y1="200" x2="80"  y2="95"  stroke="#38bdf8" stroke-width="1.0" opacity="0.55" style="animation-delay:-1.5s"/>
  <!-- STAT1 → OAS1 -->
  <line class="edge-fast" x1="305" y1="200" x2="320" y2="95"  stroke="#bae6fd" stroke-width="0.9" opacity="0.45" style="animation-delay:-0.4s"/>

  <!-- IFNG → STAT1 -->
  <line class="edge-slow" x1="340" y1="295" x2="305" y2="200" stroke="#7dd3fc" stroke-width="1.0" opacity="0.5"  style="animation-delay:-1.1s"/>

  <!-- NFKB1 → TNF -->
  <line class="edge"      x1="195" y1="295" x2="155" y2="430" stroke="#38bdf8" stroke-width="1.3" opacity="0.7"  style="animation-delay:-0.3s"/>
  <!-- NFKB1 → IL6 -->
  <line class="edge-slow" x1="195" y1="295" x2="260" y2="435" stroke="#7dd3fc" stroke-width="1.3" opacity="0.65" style="animation-delay:-1.0s"/>
  <!-- NFKB1 → IL10 -->
  <line class="edge-fast" x1="195" y1="295" x2="345" y2="370" stroke="#bae6fd" stroke-width="1.1" opacity="0.55" style="animation-delay:-0.5s"/>
  <!-- NFKB1 → CXCL10 -->
  <line class="edge"      x1="195" y1="295" x2="80"  y2="365" stroke="#38bdf8" stroke-width="1.0" opacity="0.5"  style="animation-delay:-1.3s"/>

  <!-- TNF → IL6 cross-talk -->
  <line class="edge-fast" x1="155" y1="430" x2="260" y2="435" stroke="#bae6fd" stroke-width="0.9" opacity="0.4"  style="animation-delay:-0.7s"/>

  <!-- ── NODES ── -->

  <!-- MX1 — upper left -->
  <circle class="halo" cx="80" cy="95" r="9" stroke="#38bdf8" stroke-width="1" fill="none" style="animation-delay:0.6s"/>
  <circle cx="80" cy="95" r="12" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.2" filter="url(#gl-sm)"/>
  <text x="80" y="95" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">MX1</text>

  <!-- TLR4 — upper centre (large, upstream sensor) -->
  <circle class="halo" cx="200" cy="105" r="14" stroke="#38bdf8" stroke-width="1.4" fill="none" style="animation-delay:0.4s"/>
  <circle cx="200" cy="105" r="18" fill="#1d4ed8" stroke="#38bdf8" stroke-width="2" filter="url(#gl-sm)"/>
  <text x="200" y="105" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">TLR4</text>

  <!-- OAS1 — upper right -->
  <circle class="halo" cx="320" cy="95" r="9" stroke="#7dd3fc" stroke-width="1" fill="none" style="animation-delay:1.1s"/>
  <circle cx="320" cy="95" r="12" fill="#1e3a8a" stroke="#7dd3fc" stroke-width="1.2" filter="url(#gl-sm)"/>
  <text x="320" y="95" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">OAS1</text>

  <!-- IRF3 — left middle -->
  <circle class="halo" cx="80" cy="205" r="11" stroke="#7dd3fc" stroke-width="1.2" fill="none" style="animation-delay:0.8s"/>
  <circle cx="80" cy="205" r="15" fill="#1d4ed8" stroke="#7dd3fc" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="80" y="205" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">IRF3</text>

  <!-- STAT1 — right middle -->
  <circle class="halo" cx="305" cy="200" r="11" stroke="#7dd3fc" stroke-width="1.2" fill="none" style="animation-delay:1.2s"/>
  <circle cx="305" cy="200" r="15" fill="#1d4ed8" stroke="#7dd3fc" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="305" y="200" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">STAT1</text>

  <!-- NFKB1 — central hub (largest) -->
  <circle class="halo" cx="195" cy="295" r="17" stroke="#e0f2fe" stroke-width="1.5" fill="none" style="animation-delay:0s"/>
  <circle cx="195" cy="295" r="22" fill="#1e3a8a" stroke="#e0f2fe" stroke-width="2" filter="url(#gl)"/>
  <text x="195" y="295" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#f0f9ff" font-size="9">NFKB1</text>

  <!-- IFNG — right middle -->
  <circle class="halo" cx="340" cy="295" r="9" stroke="#93c5fd" stroke-width="1" fill="none" style="animation-delay:1.4s"/>
  <circle cx="340" cy="295" r="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.2" filter="url(#gl-sm)"/>
  <text x="340" y="295" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="8.5">IFNG</text>

  <!-- CXCL10 — lower left -->
  <circle class="halo" cx="80" cy="365" r="9" stroke="#7dd3fc" stroke-width="1" fill="none" style="animation-delay:0.3s"/>
  <circle cx="80" cy="365" r="12" fill="#1e40af" stroke="#7dd3fc" stroke-width="1.2" filter="url(#gl-sm)"/>
  <text x="80" y="365" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="7.5">CXCL10</text>

  <!-- TNF — lower centre-left -->
  <circle class="halo" cx="155" cy="430" r="10" stroke="#38bdf8" stroke-width="1" fill="none" style="animation-delay:1.5s"/>
  <circle cx="155" cy="430" r="14" fill="#1e40af" stroke="#38bdf8" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="155" y="430" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">TNF</text>

  <!-- IL6 — lower centre-right -->
  <circle class="halo" cx="260" cy="435" r="10" stroke="#7dd3fc" stroke-width="1" fill="none" style="animation-delay:1.8s"/>
  <circle cx="260" cy="435" r="14" fill="#1e40af" stroke="#7dd3fc" stroke-width="1.5" filter="url(#gl-sm)"/>
  <text x="260" y="435" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">IL6</text>

  <!-- IL10 — lower right -->
  <circle class="halo" cx="345" cy="370" r="9" stroke="#93c5fd" stroke-width="1" fill="none" style="animation-delay:2.0s"/>
  <circle cx="345" cy="370" r="13" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.2" filter="url(#gl-sm)"/>
  <text x="345" y="370" class="node-lbl" text-anchor="middle" dominant-baseline="middle" fill="#bae6fd" font-size="9">IL10</text>
</svg>
