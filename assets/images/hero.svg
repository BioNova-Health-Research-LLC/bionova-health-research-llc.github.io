<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" fill="none">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .rung { animation: rung-pulse 3s ease-in-out infinite; }
      @keyframes rung-pulse { 0%,100%{opacity:0.45;} 50%{opacity:1;} }
      .node-ring { animation: ring-p 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes ring-p { 0%,100%{opacity:0.1;r:10px;} 50%{opacity:0.5;r:16px;} }
    </style>
  </defs>

  <!-- Strand A: white/light strand -->
  <path d="M 390 18 C 450 48,470 88,390 118 C 310 148,330 188,390 218 C 450 248,470 288,390 318 C 310 348,330 388,390 418 C 450 448,470 488,390 510"
        stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.92"/>

  <!-- Strand B: cyan strand -->
  <path d="M 390 18 C 330 48,310 88,390 118 C 470 148,450 188,390 218 C 330 248,310 288,390 318 C 470 348,450 388,390 418 C 330 448,310 488,390 510"
        stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.92"/>

  <!-- Turn 1 rungs -->
  <line class="rung" x1="344" y1="46"  x2="436" y2="46"  stroke="#7dd3fc" stroke-width="2"   opacity="0.8"  style="animation-delay:0s"/>
  <line class="rung" x1="328" y1="68"  x2="452" y2="68"  stroke="#bae6fd" stroke-width="2.5" opacity="0.9"  style="animation-delay:0.3s"/>
  <line class="rung" x1="321" y1="90"  x2="459" y2="90"  stroke="#7dd3fc" stroke-width="2"   opacity="0.75" style="animation-delay:0.6s"/>
  <line class="rung" x1="328" y1="110" x2="452" y2="110" stroke="#bae6fd" stroke-width="2"   opacity="0.7"  style="animation-delay:0.9s"/>

  <circle cx="354" cy="68"  r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="426" cy="68"  r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="347" cy="90"  r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="433" cy="90"  r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>

  <!-- Turn 2 rungs -->
  <line class="rung" x1="344" y1="144" x2="436" y2="144" stroke="#7dd3fc" stroke-width="2"   opacity="0.8"  style="animation-delay:0.2s"/>
  <line class="rung" x1="328" y1="165" x2="452" y2="165" stroke="#bae6fd" stroke-width="2.5" opacity="0.9"  style="animation-delay:0.5s"/>
  <line class="rung" x1="321" y1="188" x2="459" y2="188" stroke="#7dd3fc" stroke-width="2"   opacity="0.75" style="animation-delay:0.8s"/>
  <line class="rung" x1="328" y1="208" x2="452" y2="208" stroke="#bae6fd" stroke-width="2"   opacity="0.7"  style="animation-delay:1.1s"/>

  <circle cx="354" cy="165" r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="426" cy="165" r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="347" cy="188" r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="433" cy="188" r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>

  <!-- Turn 3 rungs -->
  <line class="rung" x1="344" y1="244" x2="436" y2="244" stroke="#7dd3fc" stroke-width="2"   opacity="0.8"  style="animation-delay:0.4s"/>
  <line class="rung" x1="328" y1="265" x2="452" y2="265" stroke="#bae6fd" stroke-width="2.5" opacity="0.9"  style="animation-delay:0.7s"/>
  <line class="rung" x1="321" y1="288" x2="459" y2="288" stroke="#7dd3fc" stroke-width="2"   opacity="0.75" style="animation-delay:1.0s"/>
  <line class="rung" x1="328" y1="308" x2="452" y2="308" stroke="#bae6fd" stroke-width="2"   opacity="0.7"  style="animation-delay:0.1s"/>

  <circle cx="354" cy="265" r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="426" cy="265" r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="347" cy="288" r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="433" cy="288" r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>

  <!-- Turn 4 rungs -->
  <line class="rung" x1="344" y1="344" x2="436" y2="344" stroke="#7dd3fc" stroke-width="2"   opacity="0.8"  style="animation-delay:0.6s"/>
  <line class="rung" x1="328" y1="365" x2="452" y2="365" stroke="#bae6fd" stroke-width="2.5" opacity="0.9"  style="animation-delay:0.9s"/>
  <line class="rung" x1="321" y1="388" x2="459" y2="388" stroke="#7dd3fc" stroke-width="2"   opacity="0.75" style="animation-delay:0.2s"/>
  <line class="rung" x1="328" y1="408" x2="452" y2="408" stroke="#bae6fd" stroke-width="2"   opacity="0.7"  style="animation-delay:0.5s"/>

  <circle cx="354" cy="365" r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="426" cy="365" r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="347" cy="388" r="4.5" fill="#0ea5e9" opacity="0.95" filter="url(#glow-soft)"/>
  <circle cx="433" cy="388" r="4.5" fill="#f0f9ff" opacity="0.95" filter="url(#glow-soft)"/>

  <!-- Turn 5 rungs -->
  <line class="rung" x1="344" y1="444" x2="436" y2="444" stroke="#7dd3fc" stroke-width="2"   opacity="0.8"  style="animation-delay:0.3s"/>
  <line class="rung" x1="328" y1="465" x2="452" y2="465" stroke="#bae6fd" stroke-width="2.5" opacity="0.9"  style="animation-delay:0.6s"/>
  <line class="rung" x1="321" y1="488" x2="459" y2="488" stroke="#7dd3fc" stroke-width="2"   opacity="0.75" style="animation-delay:0.9s"/>

  <circle cx="354" cy="465" r="4.5" fill="#f0f9ff" opacity="0.9" filter="url(#glow-soft)"/>
  <circle cx="426" cy="465" r="4.5" fill="#0ea5e9" opacity="0.9" filter="url(#glow-soft)"/>

  <!-- Crossover node glow rings -->
  <circle class="node-ring" cx="390" cy="118" r="10" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <circle class="node-ring" cx="390" cy="218" r="10" stroke="#e0f2fe" stroke-width="1.5" fill="none" style="animation-delay:0.9s"/>
  <circle class="node-ring" cx="390" cy="318" r="10" stroke="#38bdf8" stroke-width="1.5" fill="none" style="animation-delay:1.8s"/>
  <circle class="node-ring" cx="390" cy="418" r="10" stroke="#e0f2fe" stroke-width="1.5" fill="none" style="animation-delay:0.5s"/>

  <!-- Genome sequence strip -->
  <line x1="100" y1="505" x2="540" y2="505" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
  <text x="108" y="518" fill="#7dd3fc" font-size="13" font-family="monospace" letter-spacing="4" opacity="0.6">A T G C G A T C G A A T G C C A T G G A C T A G</text>
</svg>
